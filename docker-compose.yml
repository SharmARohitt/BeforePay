version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: beforepay-postgres
    environment:
      POSTGRES_USER: beforepay
      POSTGRES_PASSWORD: beforepay
      POSTGRES_DB: beforepay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beforepay -d beforepay"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beforepay

  redis:
    image: redis:7-alpine
    container_name: beforepay-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beforepay

volumes:
  postgres_data:

networks:
  beforepay:
    driver: bridge
